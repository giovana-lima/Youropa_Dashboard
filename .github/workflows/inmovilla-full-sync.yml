name: Inmovilla Full Property Sync

on:
  push:
    paths:
      - '.github/workflows/inmovilla-full-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Fetch all properties (full detail)
        env:
          TOKEN: ${{ secrets.INMOVILLA_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request, time

          token = os.environ["TOKEN"]
          headers = {"Content-Type": "application/json", "Token": token}

          def call(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return resp.status, json.loads(resp.read().decode())

          st, listado = call("https://procesos.inmovilla.com/api/v1/propiedades/?listado")
          print(f"listado status={st} count={len(listado)}")

          properties = []
          errors = []
          for i, p in enumerate(listado):
              cod_ofer = p["cod_ofer"]
              try:
                  time.sleep(6.2)
                  st, detail = call(f"https://procesos.inmovilla.com/api/v1/propiedades/?cod_ofer={cod_ofer}")
                  # keep only the fields we actually need, to keep the file small
                  slim = {
                      "cod_ofer": detail.get("cod_ofer"),
                      "ref": detail.get("ref"),
                      "keyacci": detail.get("keyacci"),
                      "estadoficha": detail.get("estadoficha"),
                      "nodisponible": detail.get("nodisponible"),
                      "precioinmo": detail.get("precioinmo"),
                      "precioalq": detail.get("precioalq"),
                      "comision": detail.get("comision"),
                      "cesioncom": detail.get("cesioncom"),
                      "fecha": detail.get("fecha"),
                      "fechaact": detail.get("fechaact"),
                      "fechacambio": detail.get("fechacambio"),
                      "keyagente": detail.get("keyagente"),
                      "captadopor": detail.get("captadopor"),
                      "key_tipo": detail.get("key_tipo"),
                      "key_loca": detail.get("key_loca"),
                  }
                  properties.append(slim)
              except Exception as e:
                  errors.append({"cod_ofer": cod_ofer, "error": str(e)})
              if (i+1) % 20 == 0:
                  print(f"progress: {i+1}/{len(listado)}")

          out = {"total": len(listado), "fetched": len(properties), "errors": errors, "properties": properties}
          with open("properties_raw.json", "w") as f:
              json.dump(out, f, indent=2, ensure_ascii=False)
          print("done")
          EOF

      - name: Commit raw properties data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add properties_raw.json
          git diff --staged --quiet || git commit -m "Sync: full raw properties data from Inmovilla API"
          git push
