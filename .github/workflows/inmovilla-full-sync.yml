name: Inmovilla Property Sync

on:
  schedule:
    - cron: '0 5 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Fetch all properties from the Inmovilla API
        env:
          TOKEN: ${{ secrets.INMOVILLA_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, urllib.error, time

          token = os.environ["TOKEN"]
          headers = {"Content-Type": "application/json", "Token": token}

          def call(url, retries=3):
              last = None
              for _ in range(retries):
                  try:
                      req = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(req, timeout=30) as r:
                          return json.loads(r.read().decode())
                  except urllib.error.HTTPError as e:
                      last = e
                      if e.code in (408, 429):
                          time.sleep(60); continue
                      raise
                  except Exception as e:
                      last = e; time.sleep(15)
              raise last

          listado = call("https://procesos.inmovilla.com/api/v1/propiedades/?listado")
          print("properties:", len(listado))

          props, window = [], []
          for i, p in enumerate(listado):
              now = time.time(); window.append(now)
              while window and now - window[0] > 600: window.pop(0)
              if len(window) >= 45:
                  time.sleep(max(0, 600 - (now - window[0]) + 5))
              time.sleep(6.5)
              try:
                  d = call("https://procesos.inmovilla.com/api/v1/propiedades/?cod_ofer=%s" % p['cod_ofer'])
                  props.append({k: d.get(k) for k in
                      ("cod_ofer","ref","keyacci","estadoficha","nodisponible","precioinmo",
                       "precioalq","comision","cesioncom","fecha","fechaact","fechacambio",
                       "keyagente","captadopor","key_tipo","key_loca")})
              except Exception as e:
                  print("skip", p.get("cod_ofer"), e)
              if (i+1) % 25 == 0: print("%d/%d" % (i+1, len(listado)))

          json.dump({"total": len(listado), "fetched": len(props), "properties": props},
                    open("properties_raw.json","w"), indent=2, ensure_ascii=False)
          PYEOF

      - name: Recompute the API-sourced parts of data.json
        run: |
          python3 - <<'PYEOF'
          import json, datetime
          from collections import defaultdict

          raw = json.load(open("properties_raw.json"))["properties"]
          d = json.load(open("data.json"))
          today = datetime.date.today()

          SOLD, RENTED = {3, 14}, {2, 13}

          by_month = defaultdict(int)
          for p in raw:
              f = p.get("fecha") or ""
              if f[:4].isdigit() and not f.startswith("0000"):
                  by_month[f[:7]] += 1
          months = sorted(by_month)
          cur = today.strftime("%Y-%m")
          d["newPropertiesByMonth"]["months"] = [
              ({"month": m, "count": by_month[m], "partial": True} if m == cur
               else {"month": m, "count": by_month[m]}) for m in months]
          d["newPropertiesByMonth"]["asOf"] = today.isoformat()

          def quarter(mk):
              y, m = mk.split("-"); return "Q%d %s" % ((int(m)-1)//3+1, y)

          tx, n = [], 0
          for p in raw:
              st = p.get("estadoficha")
              fc = (p.get("fechacambio") or "")[:10]
              if st not in SOLD and st not in RENTED: continue
              if not fc or fc.startswith("0000"): continue
              n += 1
              is_sale = st in SOLD
              amount = float((p.get("precioinmo") if is_sale else p.get("precioalq")) or 0)
              tx.append({"id": "R%05d" % n, "date": fc, "amount": amount,
                         "type": "sale" if is_sale else "rental",
                         "channel": "", "category": "", "project": "Ref. %s" % p.get("ref"),
                         "region": "", "clientId": "",
                         "quarter": quarter(fc[:7]), "month": fc[:7]})
          if tx: d["transactions"] = tx

          sales = [t for t in tx if t["type"] == "sale"]
          rentals = [t for t in tx if t["type"] == "rental"]
          k = d["kpisApi"]
          k["asOf"] = today.isoformat()
          k["salesVolume"] = sum(t["amount"] for t in sales)
          k["rentalVolume"] = sum(t["amount"] for t in rentals)
          k["totalVolume"] = k["salesVolume"] + k["rentalVolume"]
          k["salesCount"], k["rentalCount"] = len(sales), len(rentals)
          k["avgTicketSales"] = (k["salesVolume"]/len(sales)) if sales else None

          com_sale = sum(float(p.get("comision") or 0) for p in raw if p.get("estadoficha") in SOLD)
          com_rent = sum(float(p.get("comision") or 0) for p in raw if p.get("estadoficha") in RENTED)
          com_assign = sum(float(p.get("cesioncom") or 0) for p in raw)
          if com_sale or com_rent or com_assign:
              k["commissionSale"], k["commissionRental"] = com_sale, com_rent
              k["commissionAssignment"] = com_assign
              k["totalCommission"] = com_sale + com_rent + com_assign

          all_months = sorted(set(months) | set(t["month"] for t in tx) |
                              set(d["meta"].get("months", [])))
          d["meta"]["months"] = all_months
          d["meta"]["generatedOn"] = today.isoformat()
          d["meta"]["reportingThrough"] = cur
          d["monthlyMargin"] = dict((m, d.get("monthlyMargin", {}).get(m, 0.85)) for m in all_months)

          qc = defaultdict(lambda: {"sales": 0, "rentals": 0})
          for t in tx:
              qc[t["quarter"]]["sales" if t["type"] == "sale" else "rentals"] += 1
          order = []
          for m in all_months:
              q = quarter(m)
              if q not in order: order.append(q)
          d["quarterlyComparisonCounts"] = [
              {"quarter": q, "sales": qc[q]["sales"], "rentals": qc[q]["rentals"]} for q in order]

          existing = dict(((f["month"], f["type"], f["stage"]), f["count"]) for f in d.get("funnel", []))
          stages = ["opportunity", "visit_scheduled", "offer", "contract_signed", "win"]
          wins = defaultdict(int)
          for t in tx: wins[(t["month"], t["type"])] += 1
          funnel = []
          for m in all_months:
              for typ in ("rental", "sale"):
                  for s in stages:
                      c = wins[(m, typ)] if s == "win" else existing.get((m, typ, s), 0)
                      funnel.append({"month": m, "quarter": quarter(m), "type": typ,
                                     "stage": s, "count": c})
          d["funnel"] = funnel

          json.dump(d, open("data.json", "w"), indent=2, ensure_ascii=False)
          print("updated through", cur, "| transactions:", len(tx))
          PYEOF

      - name: Commit and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json properties_raw.json
          git diff --staged --quiet || git commit -m "Auto-sync: Inmovilla property data ($(date +%F))"
          git push
