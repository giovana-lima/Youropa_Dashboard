name: Inmovilla Property Sync

on:
  push:
    paths:
      - '.github/workflows/inmovilla-full-sync.yml'
  schedule:
    - cron: '0 5 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Fetch all properties from the Inmovilla API
        env:
          TOKEN: ${{ secrets.INMOVILLA_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, urllib.error, time

          token = os.environ["TOKEN"]
          headers = {"Content-Type": "application/json", "Token": token}

          def call(url, retries=3):
              last = None
              for _ in range(retries):
                  try:
                      req = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(req, timeout=30) as r:
                          return json.loads(r.read().decode())
                  except urllib.error.HTTPError as e:
                      last = e
                      if e.code in (408, 429):
                          time.sleep(60); continue
                      raise
                  except Exception as e:
                      last = e; time.sleep(15)
              raise last

          listado = call("https://procesos.inmovilla.com/api/v1/propiedades/?listado")
          print("properties:", len(listado))

          props, window = [], []
          for i, p in enumerate(listado):
              now = time.time(); window.append(now)
              while window and now - window[0] > 600: window.pop(0)
              if len(window) >= 45:
                  time.sleep(max(0, 600 - (now - window[0]) + 5))
              time.sleep(6.5)
              try:
                  d = call("https://procesos.inmovilla.com/api/v1/propiedades/?cod_ofer=%s" % p['cod_ofer'])
                  props.append({k: d.get(k) for k in
                      ("cod_ofer","ref","keyacci","estadoficha","nodisponible","precioinmo",
                       "precioalq","comision","cesioncom","fecha","fechaact","fechacambio",
                       "keyagente","captadopor","key_tipo","key_loca")})
              except Exception as e:
                  print("skip", p.get("cod_ofer"), e)
              if (i+1) % 25 == 0: print("%d/%d" % (i+1, len(listado)))

          json.dump({"total": len(listado), "fetched": len(props), "properties": props},
                    open("properties_raw.json","w"), indent=2, ensure_ascii=False)
          PYEOF

      - name: Refresh the closed-deal list from the API
        run: |
          python3 - <<'PYEOF'
          # This step only refreshes transactions[]. Everything else in data.json - the
          # funnel, Brokers Performance, Quarterly Comparison, New Listings - is produced
          # by scripts/build_dashboard.py in the next step, so one piece of code decides
          # every number and the two pipelines cannot drift apart.
          import csv, json, datetime, os

          raw = json.load(open("properties_raw.json"))["properties"]
          d = json.load(open("data.json"))
          SOLD, RENTED = {3, 14}, {2, 13}

          # Real closing date per property, read from the CRM state history into imoveis.csv.
          # The API's fechacambio is the last record-change date, not the closing date, and
          # several deals still carry the bulk-import dates of 12/06 and 23/06.
          won_on = {}
          if os.path.exists("data/imoveis.csv"):
              with open("data/imoveis.csv", encoding="utf-8") as fh:
                  for r in csv.DictReader(fh):
                      g = (r.get("estado_ganho_data") or "")[:10]
                      if len(g) == 10:
                          won_on[r["ref"]] = g

          def quarter(mk):
              y, m = mk.split("-")
              return "Q%d %s" % ((int(m) - 1) // 3 + 1, y)

          tx = []
          for p in raw:
              st = p.get("estadoficha")
              if st not in SOLD and st not in RENTED:
                  continue
              fc = won_on.get(p.get("ref")) or (p.get("fechacambio") or "")[:10]
              if not fc or fc.startswith("0000"):
                  continue
              is_sale = st in SOLD
              tx.append({"id": "R%05d" % (len(tx) + 1), "date": fc,
                         "amount": float((p.get("precioinmo") if is_sale else p.get("precioalq")) or 0),
                         "type": "sale" if is_sale else "rental",
                         # Real Inmovilla values only - never estimate a commission.
                         "commission": float(p.get("comision") or 0),
                         "assignmentCommission": float(p.get("cesioncom") or 0),
                         "channel": "", "category": "", "project": "Ref. %s" % p.get("ref"),
                         "region": "", "clientId": "",
                         "quarter": quarter(fc[:7]), "month": fc[:7]})
          if tx:
              d["transactions"] = tx
          d["meta"]["generatedOn"] = datetime.date.today().isoformat()
          json.dump(d, open("data.json", "w"), indent=2, ensure_ascii=False)
          print("closed deals from the API:", len(tx))
          PYEOF

      - name: Rebuild the dashboard
        run: |
          python3 scripts/build_dashboard.py
          python3 -m json.tool data.json > /dev/null

      - name: Commit and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json properties_raw.json
          git diff --staged --quiet || git commit -m "Auto-sync: Inmovilla property data ($(date +%F))"
          git push
