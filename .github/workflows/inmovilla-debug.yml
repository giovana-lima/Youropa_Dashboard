name: Inmovilla Debug

on:
  push:
    paths:
      - '.github/workflows/inmovilla-debug.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch sample property data
        env:
          TOKEN: ${{ secrets.INMOVILLA_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request

          token = os.environ["TOKEN"]
          headers = {"Content-Type": "application/json", "Token": token}

          def call(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return resp.status, json.loads(resp.read().decode())

          out = {}
          try:
              status, listado = call("https://procesos.inmovilla.com/api/v1/propiedades/?listado")
              out["listado_status"] = status
              out["listado_count"] = len(listado) if isinstance(listado, list) else None
              out["listado_sample"] = listado[:3] if isinstance(listado, list) else listado
              if isinstance(listado, list) and listado:
                  cod_ofer = listado[0]["cod_ofer"]
                  status2, detail = call(f"https://procesos.inmovilla.com/api/v1/propiedades/?cod_ofer={cod_ofer}")
                  out["detail_status"] = status2
                  out["detail_cod_ofer"] = cod_ofer
                  out["detail_sample"] = detail
          except Exception as e:
              out["error"] = str(e)

          with open("debug_output.json", "w") as f:
              json.dump(out, f, indent=2, ensure_ascii=False)
          print(json.dumps(out, indent=2, ensure_ascii=False)[:2000])
          EOF

      - name: Commit debug output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add debug_output.json
          git diff --staged --quiet || git commit -m "Debug: sample Inmovilla API property response"
          git push
