name: Inmovilla Debug

on:
  push:
    paths:
      - '.github/workflows/inmovilla-debug.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Search all fields for "Prime" across properties
        env:
          TOKEN: ${{ secrets.INMOVILLA_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request, time

          token = os.environ["TOKEN"]
          headers = {"Content-Type": "application/json", "Token": token}

          def call(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return resp.status, json.loads(resp.read().decode())

          out = {"matches": [], "checked": []}
          try:
              status, listado = call("https://procesos.inmovilla.com/api/v1/propiedades/?listado")
              candidates = [p for p in listado if str(p.get("ref","")).startswith("YR")]
              out["yr_candidates_total"] = len(candidates)
              candidates = candidates[:15]

              for p in candidates:
                  cod_ofer = p["cod_ofer"]
                  time.sleep(6.5)
                  st, detail = call(f"https://procesos.inmovilla.com/api/v1/propiedades/?cod_ofer={cod_ofer}")
                  out["checked"].append({"cod_ofer": cod_ofer, "ref": detail.get("ref")})
                  blob = json.dumps(detail, ensure_ascii=False).lower()
                  if "prime" in blob:
                      hit_fields = {k: v for k, v in detail.items() if isinstance(v, str) and "prime" in v.lower()}
                      out["matches"].append({"cod_ofer": cod_ofer, "ref": detail.get("ref"), "hit_fields": hit_fields})
          except Exception as e:
              out["error"] = str(e)

          with open("debug_output.json", "w") as f:
              json.dump(out, f, indent=2, ensure_ascii=False)
          EOF

      - name: Commit debug output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add debug_output.json
          git diff --staged --quiet || git commit -m "Debug: search for Prime Living across YR properties"
          git push
