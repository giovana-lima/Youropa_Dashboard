name: Inmovilla Debug

on:
  push:
    paths:
      - '.github/workflows/inmovilla-debug.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch enums
        env:
          TOKEN: ${{ secrets.INMOVILLA_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request, time

          token = os.environ["TOKEN"]
          headers = {"Content-Type": "application/json", "Token": token}

          def call(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return resp.status, json.loads(resp.read().decode())

          out = {}
          try:
              st1, keyacci = call("https://procesos.inmovilla.com/api/v1/enums/?tipos=keyacci")
              out["keyacci"] = keyacci
              time.sleep(31)
              st2, estadoficha = call("https://procesos.inmovilla.com/api/v1/enums/?tipos=estadoficha")
              out["estadoficha"] = estadoficha
          except Exception as e:
              out["error"] = str(e)

          with open("debug_output.json", "w") as f:
              json.dump(out, f, indent=2, ensure_ascii=False)
          EOF

      - name: Commit debug output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add debug_output.json
          git diff --staged --quiet || git commit -m "Debug: keyacci and estadoficha enums"
          git push
