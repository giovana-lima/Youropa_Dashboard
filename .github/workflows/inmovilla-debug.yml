name: Inmovilla Debug

on:
  push:
    paths:
      - '.github/workflows/inmovilla-debug.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch sample property data
        env:
          TOKEN: ${{ secrets.INMOVILLA_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request, time

          token = os.environ["TOKEN"]
          headers = {"Content-Type": "application/json", "Token": token}

          def call(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return resp.status, json.loads(resp.read().decode())

          out = {}
          try:
              status, listado = call("https://procesos.inmovilla.com/api/v1/propiedades/?listado")
              out["listado_status"] = status
              out["listado_count"] = len(listado) if isinstance(listado, list) else None

              # Prefer YR-prefixed refs (Youropa's own developments) over imported ones
              candidates = [p for p in listado if isinstance(listado, list) and str(p.get("ref","")).startswith("YR")][:6]
              if not candidates and isinstance(listado, list):
                  candidates = listado[:6]

              rows = []
              all_field_names = set()
              for p in candidates:
                  cod_ofer = p["cod_ofer"]
                  time.sleep(6)  # respect rate limit (10/min)
                  st, detail = call(f"https://procesos.inmovilla.com/api/v1/propiedades/?cod_ofer={cod_ofer}")
                  all_field_names.update(detail.keys())
                  rows.append({
                      "cod_ofer": cod_ofer,
                      "ref": detail.get("ref"),
                      "edificio": detail.get("edificio"),
                      "bloque": detail.get("bloque"),
                      "urbanizacion": detail.get("urbanizacion"),
                      "zonaauxiliar": detail.get("zonaauxiliar"),
                      "referenciacol": detail.get("referenciacol"),
                      "idArea": detail.get("idArea"),
                      "keymedio": detail.get("keymedio"),
                      "contactadopor": detail.get("contactadopor"),
                  })
              out["rows"] = rows
              out["all_field_names_union"] = sorted(all_field_names)
          except Exception as e:
              out["error"] = str(e)

          with open("debug_output.json", "w") as f:
              json.dump(out, f, indent=2, ensure_ascii=False)
          EOF

      - name: Commit debug output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add debug_output.json
          git diff --staged --quiet || git commit -m "Debug: multi-property field scan for project grouping"
          git push
